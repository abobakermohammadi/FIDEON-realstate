name: FIDEON localhost checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run localhost validation and build
        run: npm run check
      - name: Retain localhost bundle for visual QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fideon-localhost-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1